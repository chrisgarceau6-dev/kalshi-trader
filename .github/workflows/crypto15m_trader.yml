name: Crypto 15-Min Trader (BTC+ETH+SOL)

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — detect signals but place no orders (true/false)'
        required: false
        default: 'false'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: crypto15m_state.json
          key: crypto15m-state-${{ github.run_id }}
          restore-keys: crypto15m-state-

      - name: Run trader
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python crypto15m_trader.py --dry-run
          else
            python crypto15m_trader.py --once
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crypto15m_state.json
          key: crypto15m-state-${{ github.run_id }}

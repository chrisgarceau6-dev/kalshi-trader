name: Late-Certainty Trader

# ┌────────────────────────────────────────────────────────────────────┐
# │  v4 DEPLOYED 2026-08-01 — winner of exhaustive backtest search.    │
# │                                                                     │
# │  Filter: ask in [95, 99] AND prior 3 candles (same side) all >= 92c │
# │  Both YES and NO sides eligible.                                    │
# │                                                                     │
# │  Backtest (33,973 markets, 1,539 filters tested):                   │
# │    60d:  n=7,608  WR=98.51%  net@$50=+$1,972                        │
# │    40d:  n=5,035  WR=98.49%  net@$50=+$1,106                        │
# │    20d:  n=2,339  WR=98.72%  net@$50=+$821                          │
# │  OOS validation: train_WR=98.56% -> test_WR=98.72% (edge held).     │
# │  All 6 crypto series 98.29%-98.64% WR. Zero losing series.          │
# │                                                                     │
# │  Expected: ~127 trades/day, ~$33/day at $2 bets equivalent, more    │
# │  at higher bet size. High variance — judge over 500+ live trades.   │
# └────────────────────────────────────────────────────────────────────┘

on:
  schedule:
    - cron: '10-14,25-29,40-44,55-59 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — detect opportunities but place no orders'
        required: false
        default: 'false'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: certainty_state.json
          key: certainty-state-${{ github.run_id }}
          restore-keys: certainty-state-

      - name: Run trader
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          COPY_EMAIL_FROM: ${{ secrets.COPY_EMAIL_FROM }}
          COPY_EMAIL_TO: ${{ secrets.COPY_EMAIL_TO }}
          COPY_EMAIL_PASSWORD: ${{ secrets.COPY_EMAIL_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python late_certainty_trader.py --dry-run --once
          else
            python late_certainty_trader.py --once
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: certainty_state.json
          key: certainty-state-${{ github.run_id }}

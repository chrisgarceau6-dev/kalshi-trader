name: Crypto 15-Min Trader (BTC+ETH+SOL+DOGE+BNB)

on:
  # HALTED — both schedule AND workflow_dispatch disabled to prevent accidental
  # firing from external cron-job.org triggers hitting the old URL.
  workflow_dispatch:
    inputs:
      confirm_i_really_want_to_run_the_old_broken_strategy:
        description: 'Type YES to confirm you want to run this (broken) strategy'
        required: true
        default: 'NO'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: crypto15m_state.json
          key: crypto15m-state-${{ github.run_id }}
          restore-keys: crypto15m-state-

      - name: Run trader
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          COPY_EMAIL_FROM: ${{ secrets.COPY_EMAIL_FROM }}
          COPY_EMAIL_TO: ${{ secrets.COPY_EMAIL_TO }}
          COPY_EMAIL_PASSWORD: ${{ secrets.COPY_EMAIL_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python crypto15m_trader.py --dry-run
          else
            python crypto15m_trader.py --once
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crypto15m_state.json
          key: crypto15m-state-${{ github.run_id }}

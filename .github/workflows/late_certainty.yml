name: Late-Certainty Trader

# ┌────────────────────────────────────────────────────────────────────┐
# │  v5 DEPLOYED 2026-08-01 — max-return filter (replaces v4).         │
# │                                                                     │
# │  Filter: ask in [90, 99] AND prior 3 candles (same side) all >= 80c │
# │  Both YES and NO sides eligible.                                    │
# │                                                                     │
# │  Backtest of 7 crypto series (BTC/ETH/SOL/DOGE/BNB/XRP + HYPE):     │
# │    60d net @ $50: +$5,692 (2.9x v4's +$1,972)                       │
# │    60d WR:        ~96%    (v4 was 98.5%, more variance now)         │
# │    60d trades:    ~18,555 (v4 was 8,811)                            │
# │  OOS test (0-20d): +$3,574 for main 6 crypto (edge strengthened)    │
# │                                                                     │
# │  Expected: ~309 trades/day, ~$95/day at $50 bets = ~$34K/year.      │
# │  Losses ~4% of trades = ~12/day at $50 → ~-$580 gross loss/day      │
# │  offset by ~$675 gross wins. Kill switches active.                  │
# └────────────────────────────────────────────────────────────────────┘

on:
  schedule:
    - cron: '*/5 * * * *'    # backup at 0, 5, 10, 15...
    - cron: '2-59/5 * * * *' # backup at 2, 7, 12, 17... — staggered so gap is max ~2-3 min
  workflow_dispatch:

concurrency:
  group: certainty-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: certainty_state.json
          key: certainty-state-${{ github.run_id }}
          restore-keys: certainty-state-

      - name: Syntax check
        run: python -m py_compile late_certainty_trader.py

      - name: Run trader
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          COPY_EMAIL_FROM: ${{ secrets.COPY_EMAIL_FROM }}
          COPY_EMAIL_TO: ${{ secrets.COPY_EMAIL_TO }}
          COPY_EMAIL_PASSWORD: ${{ secrets.COPY_EMAIL_PASSWORD }}
        run: python late_certainty_trader.py --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: certainty_state.json
          key: certainty-state-${{ github.run_id }}

      - name: Schedule next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          sleep 60
          gh workflow run late_certainty.yml --repo chrisgarceau6-dev/polymarket-monitor2 2>/dev/null || true

name: Late-Certainty Trader

# ┌────────────────────────────────────────────────────────────────────┐
# │  REVIVED 2026-08-01 — new filter isolates a genuinely +EV subset.  │
# │                                                                     │
# │  Original strategy (ask in [88,95]) backtested at 90.9% WR — below │
# │  break-even after 7% fee, EV-negative. Kalshi's ask is calibrated   │
# │  to actual probability.                                             │
# │                                                                     │
# │  New filter: entry ask in [93, 95] AND prior 1-min candle's ask     │
# │  (same side) >= 88c. This isolates markets where confidence is      │
# │  sustained, not a spike. 60-day backtest of the new filter:         │
# │    20d:  n=3,004  WR=95.71%  net@$50=+$2,112                        │
# │    40d:  n=6,286  WR=94.93%  net@$50=+$1,661                        │
# │    60d:  n=9,791  WR=94.91%  net@$50=+$2,583                        │
# │                                                                     │
# │  Cron re-enabled. Every scan now does one extra candlestick API     │
# │  call to check the prior-minute gate.                               │
# └────────────────────────────────────────────────────────────────────┘

on:
  # Re-enabled 2026-08-01 with v3 strategy: YES-only, ask [95,99], prior_2
  # candles >= 88c. Backtest showed 98% WR — the base strategy lost because
  # it took both YES and NO sides; only YES has genuine +EV.
  schedule:
    - cron: '10-14,25-29,40-44,55-59 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — detect opportunities but place no orders'
        required: false
        default: 'false'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: certainty_state.json
          key: certainty-state-${{ github.run_id }}
          restore-keys: certainty-state-

      - name: Run trader
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          COPY_EMAIL_FROM: ${{ secrets.COPY_EMAIL_FROM }}
          COPY_EMAIL_TO: ${{ secrets.COPY_EMAIL_TO }}
          COPY_EMAIL_PASSWORD: ${{ secrets.COPY_EMAIL_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python late_certainty_trader.py --dry-run --once
          else
            python late_certainty_trader.py --once
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: certainty_state.json
          key: certainty-state-${{ github.run_id }}

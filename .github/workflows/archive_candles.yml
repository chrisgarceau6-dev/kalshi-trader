name: Archive Candle Data

# Kalshi retains settled markets for ~67 days. This job preserves each day's
# markets + 1-min candles permanently, so that hypotheses formed later have a
# genuine out-of-sample window to be tested against. Every day this does not run
# is a day of validation capacity that cannot be recovered.

on:
  schedule:
    - cron: "30 3 * * *"   # 11:30pm ET (EDT) — after the UTC day is complete
  workflow_dispatch:
    inputs:
      date:
        description: "Specific day to archive (YYYY-MM-DD). Blank = yesterday."
        required: false
        default: ""
      backfill:
        description: "Archive the last N complete days instead (skips existing)."
        required: false
        default: ""
      force:
        description: "Re-archive days that already exist. Needed after adding a series — otherwise backfill skips every day that has a file and captures nothing."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests cryptography

      - name: Archive
        env:
          KALSHI_API_KEY_ID:  ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          if [ -n "${{ inputs.backfill }}" ]; then
            python3 scripts/archive_candles.py --backfill ${{ inputs.backfill }} $FORCE
          elif [ -n "${{ inputs.date }}" ]; then
            python3 scripts/archive_candles.py ${{ inputs.date }} $FORCE
          else
            python3 scripts/archive_candles.py
          fi

      - name: Verify the day actually landed
        if: inputs.backfill == '' && inputs.date == ''
        run: |
          DAY=$(date -u -d yesterday +%Y-%m-%d)
          F="data/candles/$DAY.csv.gz"
          if [ ! -s "$F" ]; then
            echo "MISSING $F — the job reported success but wrote nothing" >&2
            exit 1
          fi
          echo "ok: $F ($(stat -c%s "$F") bytes)"

      - name: Commit archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/candles)" ]; then
            echo "nothing new to commit"
            exit 0
          fi
          git add data/candles
          git commit -m "data: archive candles $(date -u +%Y-%m-%d)"
          # late_certainty.yml persists state via actions/cache and never pushes, so
          # this job is normally the only writer to main. Retry with rebase anyway to
          # survive a concurrent human merge.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      # A silent archive failure is the expensive kind: Kalshi drops settled markets
      # at ~67 days, so a day missed here cannot be recovered later at any price.
      # daily_summary.py carries the complementary check for the case this cannot
      # see — the workflow never running at all.
      - name: Alert on failure
        if: failure()
        env:
          COPY_EMAIL_FROM:     ${{ secrets.COPY_EMAIL_FROM }}
          COPY_EMAIL_TO:       ${{ secrets.COPY_EMAIL_TO }}
          COPY_EMAIL_PASSWORD: ${{ secrets.COPY_EMAIL_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          # stdlib only, deliberately. Importing daily_summary would pull in
          # kalshi_auth -> requests/cryptography, so a failure in the Install deps
          # step would take the alert down with the job it is meant to report.
          import os, smtplib
          from email.mime.text import MIMEText
          to   = os.environ.get("COPY_EMAIL_TO", "")
          frm  = os.environ.get("COPY_EMAIL_FROM", "")
          pw   = os.environ.get("COPY_EMAIL_PASSWORD", "")
          body = (
              "scripts/archive_candles.py did not complete.\n\n"
              f"Run: {os.environ.get('RUN_URL','')}\n\n"
              "Kalshi retains settled markets ~67 days, so re-run this promptly:\n"
              "  gh workflow run archive_candles.yml -f backfill=3\n"
              "Backfill skips days that already exist, so it is safe to re-run.\n"
          )
          if not all([to, frm, pw]):
              print("email secrets missing — alert not sent\n" + body)
              raise SystemExit(0)
          m = MIMEText(body)
          m["From"], m["To"] = frm, to
          m["Subject"] = "[Kalshi] ARCHIVE FAILED — a day of data is at risk"
          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls()
              s.login(frm, pw)
              s.send_message(m)
          print("alert sent")
          PY

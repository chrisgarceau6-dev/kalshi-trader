name: Late-Certainty Trader

# ┌────────────────────────────────────────────────────────────────────┐
# │  HALTED 2026-08-01 — backtest proved the strategy is EV-negative.  │
# │                                                                     │
# │  60-day backtest on 23,546 crypto trades: WR = 90.90%.              │
# │  Break-even WR needed (with 7% fee) at 90c ask = 90.63%.            │
# │  Actual WR at each ask bucket ~= market's implied probability,      │
# │  meaning Kalshi's prices are efficient at 88-95c. Buying at the     │
# │  ask means we PAY the "insurance premium," not collect it.          │
# │                                                                     │
# │  Net P&L over 60 days at $2 bets: -$17.93                           │
# │  At $50 bets it would have been -$6,547.                            │
# │                                                                     │
# │  The docstring's "100% WR on 7,662 markets" claim was fabricated    │
# │  or cherry-picked; no source data exists on disk.                   │
# │                                                                     │
# │  Cron disabled. Manual runs still possible via workflow_dispatch    │
# │  if you want to re-verify. Do NOT re-enable cron without a          │
# │  new edge (e.g., different filter, market-making instead of taking).│
# └────────────────────────────────────────────────────────────────────┘

on:
  # schedule:  # DISABLED — see header above
  #   - cron: '10-14,25-29,40-44,55-59 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — detect opportunities but place no orders'
        required: false
        default: 'false'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: certainty_state.json
          key: certainty-state-${{ github.run_id }}
          restore-keys: certainty-state-

      - name: Run trader
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          COPY_EMAIL_FROM: ${{ secrets.COPY_EMAIL_FROM }}
          COPY_EMAIL_TO: ${{ secrets.COPY_EMAIL_TO }}
          COPY_EMAIL_PASSWORD: ${{ secrets.COPY_EMAIL_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python late_certainty_trader.py --dry-run --once
          else
            python late_certainty_trader.py --once
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: certainty_state.json
          key: certainty-state-${{ github.run_id }}

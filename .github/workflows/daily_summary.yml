name: Daily P&L Summary

on:
  schedule:
    - cron: "0 2 * * *"   # 10pm ET (EDT, UTC-4) — adjust to "0 3 * * *" in winter
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to look back (default 24)"
        required: false
        default: "24"
      trades:
        description: "Number of most recent trades (overrides hours)"
        required: false
        default: ""

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests cryptography

      - name: Run daily summary
        env:
          KALSHI_API_KEY_ID:    ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY:   ${{ secrets.KALSHI_PRIVATE_KEY }}
          COPY_EMAIL_FROM:      ${{ secrets.COPY_EMAIL_FROM }}
          COPY_EMAIL_TO:        ${{ secrets.COPY_EMAIL_TO }}
          COPY_EMAIL_PASSWORD:  ${{ secrets.COPY_EMAIL_PASSWORD }}
        run: |
          if [ -n "${{ inputs.trades }}" ]; then
            python3 daily_summary.py --trades ${{ inputs.trades }}
          else
            python3 daily_summary.py --hours ${{ inputs.hours || '24' }}
          fi

      # z-gate revert-rule check (2026-08-27). Never fails the job: this reports on the
      # gate, and a monitoring error must not look like a trading failure. It exits 2
      # when a PRE-REGISTERED revert condition trips, 3 when the archive is too stale
      # to score what it harvested, and emails on its own in both cases.
      #
      # --days 7, not 2 (2026-08-30). At ~11 rejected signals/day against an archive
      # that lags a day, a 2-day window scored roughly one day of decisions, so the
      # block rate that rule 3 watches was a rate over almost nothing. 7 days costs
      # ~4 min of log harvesting and changes no pre-registered constant.
      - name: z-gate monitor
        continue-on-error: true
        env:
          GH_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
          COPY_EMAIL_FROM:      ${{ secrets.COPY_EMAIL_FROM }}
          COPY_EMAIL_TO:        ${{ secrets.COPY_EMAIL_TO }}
          COPY_EMAIL_PASSWORD:  ${{ secrets.COPY_EMAIL_PASSWORD }}
        run: python3 scripts/zgate_monitor.py --days 7 --email || true

      # Kalshi incentive pools (2026-09-02). Kalshi's Volume Incentive Program pays
      # pro-rata on matched volume, counts the TAKER side, and accepts fills priced
      # 3c-97c — so our 90-93c flow qualifies with no strategy change, capped at
      # $0.005/contract (~93% of our 0.539c/contract fee load, ~$20/day at our run
      # rate). It ran on KXBTC15M and KXETH15M for three days in May 2026 and nobody
      # noticed, which is the entire reason this step exists.
      #
      # Silent unless there is money we can actually collect. It does NOT email on
      # liquidity pools — those pay resting size and we are 100% taker, so alerting
      # on them would fire constantly about money we structurally cannot take, and a
      # channel that fires daily gets filtered. That is the #233 failure mode, and
      # `|| true` below means email is the only live channel, exactly as for z-gate.
      #
      # Needs no Kalshi credentials: /incentive_programs is a public endpoint.
      - name: incentive watch
        continue-on-error: true
        env:
          COPY_EMAIL_FROM:      ${{ secrets.COPY_EMAIL_FROM }}
          COPY_EMAIL_TO:        ${{ secrets.COPY_EMAIL_TO }}
          COPY_EMAIL_PASSWORD:  ${{ secrets.COPY_EMAIL_PASSWORD }}
        run: python3 scripts/incentive_watch.py --email || true

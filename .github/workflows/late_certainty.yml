name: Late-Certainty Trader

# ┌────────────────────────────────────────────────────────────────────┐
# │  v5.16 — both sides trade; multi-scan polling.                    │
# │                                                                     │
# │  YES or NO 90-93c, 150-600s, prior two 1m asks >=75c.              │
# │  Flat $75 principal-risk budget; max concurrent exposure = 2.       │
# │                                                                     │
# │  Live: BTC/ETH/SOL/DOGE/BNB/XRP 15m plus KXWTI15M.                 │
# │  Exact fixed-point prices; size from worst-case limit price.        │
# │  GTC orders have server expiry and are reconciled to terminal state.│
# │  Position/order API ambiguity halts entries instead of failing open.│
# │  Unit safety checks must pass before every trading cycle.           │
# │                                                                     │
# │  Strategy evidence is tracked separately from operational safety.   │
# │  Kill switches remain active.                                       │
# │                                                                     │
# └────────────────────────────────────────────────────────────────────┘

on:
  schedule:
    - cron: '*/5 * * * *'    # backup at 0, 5, 10, 15...
    - cron: '2-59/5 * * * *' # backup at 2, 7, 12, 17... — staggered so gap is max ~2-3 min
  workflow_dispatch:

concurrency:
  group: certainty-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: certainty_state.json
          key: certainty-state-${{ github.run_id }}
          restore-keys: certainty-state-

      - name: Order-safety checks
        run: |
          python -m py_compile kalshi_auth.py late_certainty_trader.py test_order_safety.py
          if ! python -m unittest -v test_order_safety.py > /tmp/order-safety-tests.log 2>&1; then
            cat /tmp/order-safety-tests.log
            exit 1
          fi
          tail -n 5 /tmp/order-safety-tests.log

      - name: Run trader
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          COPY_EMAIL_FROM: ${{ secrets.COPY_EMAIL_FROM }}
          COPY_EMAIL_TO: ${{ secrets.COPY_EMAIL_TO }}
          COPY_EMAIL_PASSWORD: ${{ secrets.COPY_EMAIL_PASSWORD }}
        # Signal-capture fix (Aug 17): poll many times per job instead of once.
        # 70% of qualifying signals are in-band for a single 1-min candle, so a
        # single scan per job caught only ~27% of them. 240s at 15s intervals =
        # ~16 scans, and amortises the ~20s checkout/pip/cache overhead across all
        # of them. Effective cadence ~16s/scan vs ~48s before.
        run: python late_certainty_trader.py --daemon --duration 240 --interval 15

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: certainty_state.json
          key: certainty-state-${{ github.run_id }}

      - name: Upload live state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-state
          path: certainty_state.json
          retention-days: 1
          overwrite: true

      - name: Schedule next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          sleep 5
          gh workflow run late_certainty.yml --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

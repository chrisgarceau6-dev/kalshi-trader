services:
  - type: web
    name: kalshi-dashboard
    env: python
    buildCommand: pip install flask requests cryptography
    startCommand: python kalshi_dashboard.py
    envVars:
      - key: KALSHI_API_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY
        sync: false
      # Required. The service refuses to serve account data without it, because the
      # dashboard URL is published in a public repo.
      - key: DASH_TOKEN
        sync: false
      # Optional. Raises the GitHub API limit from 60/hr to 5000/hr for the health
      # check; the check works unauthenticated on this public repo without it.
      - key: GH_READ_TOKEN
        sync: false
